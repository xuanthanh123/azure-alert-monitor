name: Sync Excel to JSON (Real-time)

on:
  schedule:
    - cron: '*/3 * * * *'  # Mỗi 3 phút
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Excel as CSV (force fresh)
        run: |
          curl -L \
               -H "Accept: text/csv" \
               "https://truecommerceedi-my.sharepoint.com/:x:/g/personal/thanh_nguyen_truecommerce_com/EQb32huhvRpKrsGIFZD_V8UBpEydu9Y90vAGBL4vBNNoZQ?download=1" \
               -o status.csv

      - name: Parse to JSON
        run: |
          STATUS=$(tail -n 1 status.csv | tr -d '\r')
          echo "{\"status\": $STATUS}" > status.json

      - name: Commit & Push
        run: |
          git config user.name "Auto Sync"
          git config user.email "sync@github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update status: $STATUS"
          git push
