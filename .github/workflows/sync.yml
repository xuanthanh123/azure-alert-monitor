name: Sync SharePoint CSV to GitHub JSON

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CSV
        run: |
          curl -L "https://truecommerceedi-my.sharepoint.com/:t:/g/personal/thanh_nguyen_truecommerce_com/EX6NkmCE1m5Kv5aIxThpxBQBAynKfSFYOWC-P9KwsU0IhQ?format=csv" -o status.csv

      - name: Parse CSV to JSON
        run: |
          STATUS=$(tail -n 1 status.csv | tr -d '\r')
          echo "{\"status\": $STATUS}" > status.json

      - name: Commit & Push
        run: |
          git config user.name "Auto Sync"
          git config user.email "sync@github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Sync from SharePoint"
          git push
