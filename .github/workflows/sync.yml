name: Sync Excel to JSON

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Bắt buộc để push
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}  # Dùng PAT

      - name: Download Excel as CSV
        run: |
          curl -L \
               -H "Accept: text/csv" \
               "https://truecommerceedi-my.sharepoint.com/:x:/g/personal/thanh_nguyen_truecommerce_com/EQb32huhvRpKrsGIFZD_V8UBpEydu9Y90vAGBL4vBNNoZQ?download=1" \
               -o status.csv

      - name: Parse to JSON
        run: |
          STATUS=$(tail -n 1 status.csv | tr -d '\r')
          echo "{\"status\": $STATUS}" > status.json

      - name: Commit & Push
        run: |
          git config user.name "Auto Sync"
          git config user.email "sync@github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update status: $STATUS"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
          git push
